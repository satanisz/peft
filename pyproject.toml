[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peft-banking-workshop"
version = "0.1.0"
description = "Materiały i benchmark do warsztatu LoRA/QLoRA w bankowości"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
llm = [
  "accelerate>=1.2,<2",
  "safetensors>=0.5,<1",
  "torch>=2.10,<2.12",
  "transformers>=5.0,<6",
]
train = [
  "bitsandbytes>=0.49,<0.50",
  "datasets>=4.0,<5",
  "peft>=0.18,<0.20",
  "trl>=0.28,<0.30",
]

[project.scripts]
peft-workshop = "peft_workshop.cli:main"
peft-baseline = "peft_workshop.baseline:main"
peft-preflight = "peft_workshop.preflight:main"
peft-generate-dataset = "peft_workshop.dataset_v1:main"
peft-audit-dataset = "peft_workshop.data_audit:main"
peft-token-stats = "peft_workshop.token_stats:main"
peft-baseline-report = "peft_workshop.baseline_report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/peft_workshop"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
